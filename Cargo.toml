[package]
name = "localgateway-sdk"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Thin runtime SDK for registering providers with LocalGateway"

[dependencies]
localgateway-api = { git = "https://github.com/HuanyuMark/localgateway-api", tag = "v0.2.2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
axum = "0.8"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
